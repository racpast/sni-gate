# sni-gate configuration.
#
# Copy to `sni-gate.toml` and edit. Run:  sni-gate.exe            (loads ./sni-gate.toml)
#                                    or:  sni-gate.exe -c <path>
#
# Model: [global] defaults → [[listener]] (one per inbound port) → each
# listener's [[listener.route]] rules + optional [listener.default_route].
# Overridable settings inherit outward, each scope's `use = "…"` template just
# below its explicit values:
#   route → route's template → listener → listener's template → global
# The whole [ech] block inherits field-by-field along the same ladder, so shared
# ECH settings live once in [global.ech] / [listener.ech] / a template. So does
# [verify], which states what an upstream certificate must prove.

# ---------------------------------------------------------------------------
# Global defaults (outermost fallback scope)
# ---------------------------------------------------------------------------
[global]
log = "info"                                   # or SNI_GATE_LOG / RUST_LOG

# Generic DNS resolver used for both ECH HTTPS-record lookups and upstream
# A/AAAA, unless overridden. Forms:
#   "system"                          the OS resolver
#   "https://host[:port]/dns-query"   DoH
#   "tls://host[:port]"               DoT
#   "udp://ip[:port]" | "ip[:port]"   plain DNS to an IP
#   "@resolver-name"                  reference to [resolvers.<name>] declaration
resolver = "system"                            # e.g. "https://dns.example/dns-query" or "@cloudflare"
# ech_resolver / addr_resolver may override the generic resolver per purpose.
ech_refresh = "1h"                             # ECH config refresh bound
# nat64_prefix = "64:ff9b::"                   # /96 prefix, hierarchical
# address_family = "dual"                      # dual (default) | ipv4 | ipv6
#   dual races AAAA against A (RFC 8305) so a broken local IPv6 path cannot
#   strand an upstream; setting nat64_prefix turns the race off, because a
#   synthesized address is the same v6 path rather than a second one.
# Fail/unmatched policy. Field-less modes take a bare string; passthrough needs
# a table:  unmatched = "close"  |  "system-outbound"  |
#           { mode = "passthrough", addr = "127.0.0.1:80" }
unmatched = "close"

# Shared [http2] defaults, inherited field-by-field like [ech]. HTTP/2 is opt-in.
#
# sni-gate splices bytes rather than parsing HTTP, so inbound and upstream always
# speak the SAME protocol — there is no "h2 in, http/1.1 out". `enabled` is one
# coupled switch:
#   tls / ech   the upstream is dialed first and whatever ALPN it selects is
#               mirrored back to the client (so an http/1.1-only upstream simply
#               downgrades that connection; no mismatch is possible)
#   http        [h2, http/1.1] is offered inbound and an h2 stream is spliced to
#               the cleartext backend as prior-knowledge h2c (backend must do h2c)
#   raw         never terminates TLS; enabling http2 on a raw route is an error,
#               but an inherited value here is simply ignored by raw routes
[global.http2]
enabled = false
# The startup h2c check for `http` routes. It VALIDATES, it never DECIDES: no
# mode silently downgrades a route to HTTP/1.1, because a probe result goes stale
# as soon as the backend is reconfigured.
#   "off"      no probe
#   "warn"     log loudly, keep HTTP/2 enabled  (default — a backend that simply
#              hasn't started yet must not stop the gateway from booting)
#   "require"  fail startup
probe = "warn"
# probe_timeout = "3s"

# Shared [verify] defaults: what an upstream's certificate must prove before
# this gateway will talk to it. Inherited field-by-field like [ech], and also
# read by [resolvers.<name>.verify] and [pools.<name>.probe.verify].
#
# The default — nothing written anywhere — is the strongest setting there is:
# chain to the web-PKI roots AND be valid for the name the route asked for. You
# only need this block when that is not satisfiable, which happens when the name
# transmitted is not the name the upstream's certificate is for (see the "no-sni"
# route below). Weakening it here applies to EVERY TLS upstream in this file,
# including a DoH resolver's own handshake, so prefer a per-route block.
#
# [global.verify]
# mode = "full"                 # full (default) | chain (no name check) | none
# pins = []                     # sha256/<base64> SPKI pins; an ADDITIONAL
#                               # requirement in every mode, and the only
#                               # assurance left under mode = "none"
# ca_file = "corp-root.pem"     # extra trust anchors (a private CA)
# trust_webpki = true           # false narrows trust to ca_file alone
# `verify.name` is route-scope only — it describes one upstream's certificate —
# so it is written on a route or the template that route uses, never here.

# Shared [ech] defaults, inherited field-by-field by every ECH route that does
# not override them. A route may then omit [ech] entirely or set just one field.
[global.ech]
mode = "doh"                                   # static | doh | doh-with-fallback
ech_domain = "ech.example"                     # HTTPS record carrying `ech=`
require_ech = true
# max_retries = 2                              # ECH-reject retries

# ---------------------------------------------------------------------------
# Named templates (reusable bundles referenced by `use = "<name>"`)
# ---------------------------------------------------------------------------
# A template may carry any reusable field (type, upstream, override_sni,
# cert/key, a whole [ech] block, fail, and the overridable knobs) — but not the
# route identity (name, match_sni). It sits just below its scope's explicit
# values in the ladder. One `use` per scope; templates cannot use other
# templates. `upstream` in a template applies only when used by a route.
[templates.ech-edge]
type = "ech"
address_family = "ipv4"
nat64_prefix = "64:ff9b::"    # RFC 6052 well-known /96 (use your own if you have one)
# Inherits mode/ech_domain/require_ech from [global.ech]; override here if needed.

# ---------------------------------------------------------------------------
# Certificate authority (dynamic per-SNI issuance on TLS termination)
# ---------------------------------------------------------------------------
[ca]
cert_path = "ca/ca.crt"       # generated on first run if missing
key_path  = "ca/ca.key"
common_name = "SNI Gate Local CA"
organization = ""             # optional O on the CA and issued leaves
country = ""                  # optional C
leaf_validity_days = 397
install_to_system_root = false  # trust the CA on every startup; needs elevated
                                # privileges (Administrator/root), idempotent,
                                # warns on failure. `--install-ca` does it once.

# Certificate coverage is not configurable, because guessing it is what breaks
# HTTP/2. The first handshake for an unknown name is answered with an EXACT
# certificate (that one name, no wildcard). When a TLS-terminating route later
# hands the connection to a TLS upstream, the upstream's real certificate is read
# and its DNS SANs are mirrored: coverage widens only to what the upstream itself
# vouches for, so a browser may only coalesce where the upstream would accept the
# coalesced `:authority`. If the upstream's SANs shrink on a later handshake, the
# cached leaf is invalidated and re-signed narrower.
#
# A mirrored name is still withheld when it would cover a host this listener
# routes to a different upstream: a browser holding a connection whose cert covers
# a second origin may send that origin's requests over it (RFC 9113 §9.1.1) with
# no new TLS handshake and hence no new SNI, which would bypass routing entirely.
# Certificates are therefore partitioned by forwarding target and persisted as
# certs/<scope>/<host>.crt. Withheld names are logged with the conflicting host.

[store]
enabled = true                # persist issued certs across restarts
dir = "certs"                 # laid out as <dir>/<scope>/<host>.crt
renew_margin_days = 30

[cache]
capacity = 8192
ttl_secs = 86400

# ===========================================================================
# Public Suffix List
# ===========================================================================
# Determines the registrable-domain anchor for issued certificates.
[psl]
source = "embedded"           # embedded | file
# When source = "file":
# path = "cache/public_suffix_list.dat"
# auto_update = false         # download PSL when stale
# update_url = "https://publicsuffix.org/list/public_suffix_list.dat"
# max_age = "30d"             # how old before considered stale
# check_interval = "6h"       # how often to check at runtime (omit = startup only)
# update_timeout = "30s"
# auto_reload = false         # hot-reload when file changes (via file watcher)

# ===========================================================================
# Listener 1 — HTTPS on 443
# ===========================================================================
[[listener]]
# `addr` accepts a full socket address ("0.0.0.0:443", "[::]:443") or a bare
# port ("443" or integer 443), which expands to 0.0.0.0:<port> — the IPv4
# wildcard, matching nginx's `listen 443` semantics. For dual-stack, add a
# second listener on "[::]:443".
addr = "0.0.0.0:443"
connect_timeout = "5s"

  # `upstream` may default either part. Forms:
  #   "host:port"  fixed host and port (IPv6 in brackets: "[2001:db8::1]:443")
  #   "host"       fixed host; port = this listener's port
  #   "8443"       port only; host = the matched source SNI/Host
  #   (omitted)    host = the matched source SNI/Host; port = this listener's port
  # A defaulted host reflects the routing key (inbound SNI/Host, port-stripped)
  # per connection; override_sni does not change the dial target.

  # ECH re-origination: hide the true SNI from the path to the CDN edge. This
  # route pins a full inline (static) ECHConfig, overriding the [global.ech] doh
  # default.
  [[listener.route]]
  name = "site-a"
  type = "ech"
  match_sni = [".site-a.example"]    # exact | *.x | .x (suffix) | @name (named regex)
  upstream = "edge.example:443"
  # override_sni: inner (protected) SNI for ech, upstream SNI for tls.
  #   (omitted)  reflect the inbound SNI verbatim
  #   "name"     send exactly that name
  #   ""         send NO SNI extension at all (RFC 9849 §5 allows a
  #              ClientHelloInner with no SNI; for ech the ECHConfig public name
  #              is still sent in the outer hello). The upstream certificate is
  #              still verified against the name that would have been sent.
  # override_sni = "real.inner.example"
  # nat64_prefix / addr_resolver / ech_resolver may be set here, per route.

    [listener.route.ech]
    mode = "static"                  # override the global "doh" default
    config = "<base64 ECHConfigList>"

  # These two collapse to just match_sni (+ use): type comes from the `ech-edge`
  # template, and mode/ech_domain/require_ech from [global.ech].
  # `upstream` omitted → reflect to <matched SNI>:443 (this listener's port).
  [[listener.route]]
  name = "grouped"
  use = "ech-edge"
  match_sni = [".site-b.example", ".site-c.example"]

  [[listener.route]]
  name = "site-d"
  use = "ech-edge"
  match_sni = [".site-d.example"]
  upstream = "127.0.0.1:80"          # override the reflecting default

  # Plain TLS upstream with an overridden SNI.
  [[listener.route]]
  name = "direct"
  type = "tls"
  match_sni = ["*.direct.example"]
  upstream = "127.0.0.1:8866"
  override_sni = "backend.internal"

  # Plain TLS upstream with NO SNI sent (override_sni = ""). Useful for a backend
  # addressed by IP, or one that keys only off the certificate it serves. The
  # upstream cert is still verified against the reflected inbound name.
  [[listener.route]]
  name = "no-sni"
  type = "tls"
  match_sni = ["*.nosni.example"]
  upstream = "127.0.0.1:8867"
  override_sni = ""

  # The same shape, but pointed at a real virtual host: with no SNI to select a
  # certificate, the upstream answers with its DEFAULT one — issued for whatever
  # name its operator chose, not for the name the client asked for. Verification
  # then fails, correctly:
  #
  #   upstream TLS handshake: invalid peer certificate: certificate not valid for
  #   name "fra-storage.example.com"; certificate is only valid for
  #   DnsName("*.example.net")
  #
  # [verify] states the proposition this deployment can actually prove. `name`
  # is the field to reach for first: chain, expiry and name are ALL still
  # enforced — only the subject of the claim moves.
  [[listener.route]]
  name = "default-cert"
  type = "tls"
  match_sni = [".example.com"]
  override_sni = ""

    [listener.route.verify]
    name = "default.example.net"     # verify against what the upstream serves
    # mode = "chain"                 # or: keep the chain check, drop the name
    #                                # check entirely (more durable if the
    #                                # upstream's default cert changes names,
    #                                # but it then accepts ANY publicly-trusted
    #                                # certificate — prefer `name` or `pins`)
    # pins = ["sha256/YLh1dUR9y6Kja30RrAn7JKnbQG/uEtLMkBgFF2Fuihg="]
    #                                # bind the upstream to one public key:
    #                                # openssl s_client -connect host:443 \
    #                                #   -servername host </dev/null \
    #                                # | openssl x509 -pubkey -noout \
    #                                # | openssl pkey -pubin -outform der \
    #                                # | openssl dgst -sha256 -binary | base64

  # A private CA: the upstream's chain is verified, just not against the public
  # roots. `trust_webpki = false` requires a ca_file, since it would otherwise
  # leave no trust anchors at all (a load-time error).
  # [[listener.route]]
  # name = "internal"
  # type = "tls"
  # match_sni = [".internal.example"]
  #   [listener.route.verify]
  #   ca_file = "corp-root.pem"
  #   trust_webpki = false

  # Cleartext HTTP upstream.
  [[listener.route]]
  name = "plain"
  type = "http"
  match_sni = ["plain.example"]
  upstream = "127.0.0.1:8080"

  # Same, but with HTTP/2 end to end: clients negotiate h2, and the decrypted h2
  # stream is spliced to the backend as prior-knowledge h2c. The backend must be
  # configured for h2c (nginx `listen 8081 http2;`, caddy `h2c://`, …), which is
  # what the startup probe checks.
  [[listener.route]]
  name = "plain-h2"
  type = "http"
  match_sni = ["h2.example"]
  upstream = "127.0.0.1:8081"

    [listener.route.http2]
    enabled = true
    # Inherits probe = "warn" from [global.http2]: a backend that cannot do h2c
    # is reported loudly but does not stop the gateway from starting. Once you
    # know the backend really does speak h2c, tighten it to "require" so that a
    # later regression (someone drops `http2 on`) fails fast instead of quietly
    # breaking this route at runtime:
    # probe = "require"

  # Catch-all for SNI/Host matching no route above.
  [listener.default_route]
  type = "tls"
  upstream = "127.0.0.1:443"
  require_ech = false
  fail = "close"

# ===========================================================================
# Listener 2 — 8443, raw passthrough (no termination, no cert issued)
# ===========================================================================
[[listener]]
addr = "0.0.0.0:8443"
connect_timeout = "5s"

  [[listener.route]]
  name = "raw-a"
  type = "raw"
  match_sni = [".raw.example"]
  upstream = "127.0.0.1:5553"

  # Reflect: splice each connection back to its own SNI/Host on this listener's
  # port (8443). `upstream` is omitted. Set `upstream = "9000"` to reflect to
  # <SNI/Host>:9000 instead.
  [[listener.route]]
  name = "reflect"
  type = "raw"
  match_sni = [".mirror.example"]

# ---------------------------------------------------------------------------
# Named resolvers (advanced DNS configuration with bootstrap chains and ECH)
# ---------------------------------------------------------------------------
# Named resolvers enable DoH/DoT endpoints to be resolved through other
# resolvers (bootstrap chains), support upstream override for CDN fronting,
# and can use ECH to protect their own TLS handshake. Reference them with
# @ prefix: resolver = "@cloudflare"
#
# [resolvers.cloudflare]
# endpoint = "https://1.1.1.1/dns-query"
#
# [resolvers.google]
# endpoint = "https://dns.google/dns-query"
# upstream = "edge.cdn.example"      # CDN fronting: dial edge, SNI dns.google
# bootstrap = "@cloudflare"          # Resolve dns.google via cloudflare
#
# [resolvers.secure]
# endpoint = "https://doh.example/dns-query"
# bootstrap = "@cloudflare"
#   [resolvers.secure.ech]
#   mode = "doh"
#   require_ech = true
#   ech_resolver = "@cloudflare"     # Cloudflare fetches secure's ECH config
#
# A resolver's own handshake is verified like any other upstream, and [verify]
# applies to it the same way — fields inherit from [global.verify] only, since a
# resolver has no listener or route above it. `upstream` (CDN fronting) is the
# usual reason to need it: the edge you dial may answer with its own
# certificate rather than the endpoint's.
#
# [resolvers.fronted]
# endpoint = "https://doh.example/dns-query"
# upstream = "edge.cdn.example"
# bootstrap = "@cloudflare"
#   [resolvers.fronted.verify]
#   name = "edge.cdn.example"        # verify what the edge really serves
#
# Only a DoH/DoT endpoint performs a handshake, so writing [verify] on a plain
# or `system` resolver is a load-time error rather than a silent no-op.

# ---------------------------------------------------------------------------
# Upstream pools (adaptive endpoint selection)
# ---------------------------------------------------------------------------
# A pool is a set of endpoints that all serve the same role. sni-gate probes
# them in the background and routes to the lowest-RTT healthy one, failing over
# automatically. Reference one with @ prefix: upstream = "@cf"
#
# TARGETS AND CANDIDATES. A *target* is one `targets` entry and has a stable
# index; that index is what `fallback`, `nat64.from` and `select` refer to. A
# *candidate* is one probed address, and one target yields several: a domain
# yields one per A/AAAA record, a CIDR one per sampled address. Tags belong to
# candidates (a domain's A record is `ipv4`, its AAAA record is `ipv6`), which is
# why an index addresses a target while a tag matches a candidate.
#
# [pools.cf]
# targets = [
#     "cf.example.com",                                     # [0] domain
#     "104.16.0.0/12[4]",                                   # [1] CIDR, sample 4
#     "172.64.0.0/13[4]",                                   # [2] CIDR, sample 4
#     { addr = "2606:4700::/32[4]", tags = ["native-v6"] },  # [3] custom tag
# ]
# fallback = 0                       # target index used until something is healthy
# resolver = "@cloudflare"           # who resolves this pool's domain targets
#
# `[N]` samples N random addresses from a CIDR. Omitting it expands the range,
# which is refused above 64 addresses — a /12 holds a million. Samples are drawn
# once at startup so RTT measurements survive; one that never answers is
# eventually replaced.
#
#   [pools.cf.probe]
#   mode = "http"                    # tcp | tls | http
#   url = "https://cloudflare.com/cdn-cgi/trace"  # http: the whole request
#   expect_status = [200]            # http: response codes counted as healthy
#   timeout = "5s"                   # per-candidate deadline (3s tcp/tls, 5s http)
#   interval = "5m"                  # cycle for a healthy candidate
#   degraded_interval = "30s"        # FIRST retry delay, doubling up to interval
#   fail_threshold = 2               # consecutive failures before degradation
#
# Each mode takes only the fields it can act on, and a field it cannot is an
# error rather than a silent no-op — writing `expect_status` on a `tls` probe
# would otherwise leave you believing the response is checked when the probe
# stops at the handshake:
#
#   tcp   port (default 443), timeout
#   tls   port (default 443), sni, timeout, [ech]
#   http  url, expect_status, timeout, [ech] (https:// only)
#
# An `http` probe has no `sni` or `port` of its own: the URL already carries the
# scheme, host, port and path, so there is one place to look and no way for them
# to disagree. RTT stops at the first response byte, so a large body never
# inflates the measurement.
#
#   [pools.cf.probe]
#   mode = "tls"
#   sni = "cloudflare.com"           # required for tls
#   port = 443
#
# `sni` and `port` belong to the pool, not to any route: the probe measures link
# quality to an edge node, not the response for one host. A route applies its own
# port to the chosen address, so `upstream = "@cf:8443"` needs no second pool.
#
# RTT is a moving average, and switching requires a 20%/5ms margin, so a single
# slow sample never moves traffic. A degraded candidate backs off exponentially,
# so one permanently dead endpoint cannot pin the pool to the fast cycle.
#
# A `tls` or `https://` probe can hide its own SNI with ECH. The block is the
# same one routes and resolvers use, and its fields inherit from `[global.ech]`
# field-by-field — but its *presence* never does, so a `[global.ech]` written for
# your routes will not silently start hiding every probe:
#
#     [pools.cf.probe.ech]
#     mode = "doh"                   # static | doh | doh-with-fallback
#     config = "AEX+DQBBkw..."       # base64 ECHConfigList; static / fallback
#     ech_domain = "crypto.cloudflare.com"  # HTTPS record queried for `ech=`
#     require_ech = true             # fail the candidate unless ECH was accepted
#     max_retries = 2                # refetch-and-retry budget on ECH rejection
#     ech_refresh = "1h"             # upper bound on the HTTPS record's own TTL
#     ech_resolver = "@cloudflare"   # who resolves it; default: the pool's own
#
# The ECHConfigList is fetched once per probe SNI and refreshed on the record's
# TTL, never per probe. `require_ech = false` falls back to GREASE when nothing
# is published, which sends the SNI in the clear — leave it on unless you mean
# exactly that.
#
# A `tls` or `https://` probe verifies the certificate it is presented, and says
# what it requires the same way a route does. This is its OWN connection: a
# route that relaxes verification does not relax its pool's probing, and a pool
# whose edge nodes answer an unmatched name needs this block or every candidate
# will be marked degraded. Fields inherit from [global.verify] only.
#
#     [pools.cf.probe.verify]
#     mode = "chain"                 # full (default) | chain | none
#     name = "edge.cdn.example"      # or: verify what the edges really serve
#     pins = []                      # SPKI pins, checked in every mode
#
# A probe that accepts any certificate is still a useful reachability and RTT
# measurement; it simply stops attesting to the identity of what answered. A
# `tcp` or cleartext-`http` probe sees no certificate at all, so writing
# [verify] there is a load-time error.
#
#   [pools.cf.nat64]                 # address-family projection, not a new pool
#   prefixes = ["64:ff9b::"]         # each IPv4 candidate x each prefix
#   from = [1, 2]                    # target indices; omit for all
#   timeout = "8s"                   # NAT64 carries an extra hop
#
# Synthesized addresses are probed and ranked independently of their IPv4
# originals, and are tagged `nat64` + `ipv6`.
#
# SELECTING CANDIDATES. `select` on a route or template filters which candidates
# that consumer ranks. Strings match tags, integers match target indices, and all
# entries are unioned (OR):
#
# [templates.cf-v4]
# upstream = "@cf"
# select = ["ipv4"]                  # IPv4 only
#
# [templates.cf-nat64]
# upstream = "@cf"
# select = ["nat64"]                 # NAT64-synthesized only
#
# [templates.cf-native-v6]
# upstream = "@cf"
# select = ["native-v6"]             # custom tag: native IPv6, excluding NAT64
#
# [templates.cf-best]
# upstream = "@cf"                   # every candidate; best RTT wins
#
# A pool resolves its own targets, so `address_family`, `nat64_prefix` and
# `addr_resolver` are rejected on a route whose upstream is a pool — set them on
# the pool instead. Values merely inherited from [global] are ignored, not an
# error. `select` is likewise rejected on a non-pool upstream, where it would do
# nothing.
#
# ADAPTIVE THROUGHPUT-AWARE ROUTING. By default, pools rank by RTT alone. For
# large-transfer workloads (images, videos, downloads), enable composite scoring
# that learns throughput from completed connections:
#
# [pools.cdn-adaptive]
# targets = ["cdn-a.example.com", "cdn-b.example.com", "cdn-c.example.com"]
#
#   [pools.cdn-adaptive.probe]
#   mode = "http"
#   url = "https://media.example.com/health"
#   expect_status = [200]
#   interval = "5m"
#   # Enable throughput-aware routing (0 = pure RTT, the default)
#   score_payload_bytes = 1_000_000      # 1 MB reference payload
#                                        # 100_000 for images, 10_000_000 for video
#   # NIG observation discount in (0,1]. Higher retains older evidence longer.
#   throughput_discount = 0.95           # default: 0.95
#                                        # 0.98 for stable, 0.90 for bursty
#   # Kalman process noise (ms²). Higher = faster adaptation to routing changes.
#   rtt_process_noise = 0.01             # default: 0.01
#                                        # 0.001 stable, 0.1 variable paths
#   # Kalman observation noise (ms²). Expected probe measurement variance.
#   rtt_obs_noise = 0.1                  # default: 0.1
#                                        # 0.05 low-jitter, 0.5 high-jitter
#   # Concurrent probes per cycle (1..4096)
#   max_concurrent_probes = 32           # default: 16
#                                        # 8 for small pools, 64 for large
#
# The gateway learns each candidate's throughput from completed connections and
# uses Thompson Sampling to balance exploitation (route to known-good) with
# exploration (discover better alternatives). Candidates are grouped by /24 (IPv4)
# or /48 (IPv6) subnet, so observations on one candidate improve estimates for
# siblings.
