# sni-gate configuration.
#
# Copy to `sni-gate.toml` and edit. Run:  sni-gate.exe            (loads ./sni-gate.toml)
#                                    or:  sni-gate.exe -c <path>
#
# Model: [global] defaults → [[listener]] (one per inbound port) → each
# listener's [[listener.route]] rules + optional [listener.default_route].
# Overridable settings inherit outward, each scope's `use = "…"` template just
# below its explicit values:
#   route → route's template → listener → listener's template → global
# The whole [ech] block inherits field-by-field along the same ladder, so shared
# ECH settings live once in [global.ech] / [listener.ech] / a template.

# ---------------------------------------------------------------------------
# Global defaults (outermost fallback scope)
# ---------------------------------------------------------------------------
[global]
log = "info"                                   # or SNI_GATE_LOG / RUST_LOG

# Generic DNS resolver used for both ECH HTTPS-record lookups and upstream
# A/AAAA, unless overridden. Forms:
#   "system"                          the OS resolver
#   "https://host[:port]/dns-query"   DoH
#   "tls://host[:port]"               DoT
#   "udp://ip[:port]" | "ip[:port]"   plain DNS to an IP
resolver = "system"                            # e.g. "https://dns.example/dns-query"
# ech_resolver / addr_resolver may override the generic resolver per purpose.
ech_refresh = "1h"                             # ECH config refresh bound
# nat64_prefix = "64:ff9b::"                   # /96 prefix, hierarchical
# address_family = "dual"                      # dual (default) | ipv4 | ipv6
# Fail/unmatched policy. Field-less modes take a bare string; passthrough needs
# a table:  unmatched = "close"  |  "system-outbound"  |
#           { mode = "passthrough", addr = "127.0.0.1:80" }
unmatched = "close"

# Shared [ech] defaults, inherited field-by-field by every ECH route that does
# not override them. A route may then omit [ech] entirely or set just one field.
[global.ech]
mode = "doh"                                   # static | doh | doh-with-fallback
ech_domain = "ech.example"                     # HTTPS record carrying `ech=`
require_ech = true
# max_retries = 2                              # ECH-reject retries

# ---------------------------------------------------------------------------
# Named templates (reusable bundles referenced by `use = "<name>"`)
# ---------------------------------------------------------------------------
# A template may carry any reusable field (type, upstream, override_sni,
# cert/key, a whole [ech] block, fail, and the overridable knobs) — but not the
# route identity (name, match_sni). It sits just below its scope's explicit
# values in the ladder. One `use` per scope; templates cannot use other
# templates. `upstream` in a template applies only when used by a route.
[templates.ech-edge]
type = "ech"
address_family = "ipv4"
nat64_prefix = "64:ff9b::"    # RFC 6052 well-known /96 (use your own if you have one)
# Inherits mode/ech_domain/require_ech from [global.ech]; override here if needed.

# ---------------------------------------------------------------------------
# Certificate authority (dynamic per-SNI issuance on TLS termination)
# ---------------------------------------------------------------------------
[ca]
cert_path = "ca/ca.crt"       # generated on first run if missing
key_path  = "ca/ca.key"
common_name = "SNI Gate Local CA"
organization = ""             # optional O on the CA and issued leaves
country = ""                  # optional C
leaf_validity_days = 397
install_to_system_root = false  # opt-in; Administrator on Windows; idempotent

[issuance]
wildcard = true               # issue {base, *.base} anchored at the registrable domain

[store]
enabled = true                # persist issued certs across restarts
dir = "certs"
renew_margin_days = 30

[cache]
capacity = 8192
ttl_secs = 86400

[cache.psl]                   # public-suffix list (wildcard base derivation)
source = "embedded"           # embedded | file | network
# path = "public_suffix_list.dat"
# url = "https://publicsuffix.org/list/public_suffix_list.dat"
# cron = "0 17 3 * * 0"       # weekly refresh (network mode)
# timeout_secs = 30
# proxy = ""                  # optional; empty = direct

# ===========================================================================
# Listener 1 — HTTPS on 443
# ===========================================================================
[[listener]]
addr = "0.0.0.0:443"
connect_timeout = "5s"

  # `upstream` may default either part. Forms:
  #   "host:port"  fixed host and port (IPv6 in brackets: "[2001:db8::1]:443")
  #   "host"       fixed host; port = this listener's port
  #   "8443"       port only; host = the matched source SNI/Host
  #   (omitted)    host = the matched source SNI/Host; port = this listener's port
  # A defaulted host reflects the routing key (inbound SNI/Host, port-stripped)
  # per connection; override_sni does not change the dial target.

  # ECH re-origination: hide the true SNI from the path to the CDN edge. This
  # route pins a full inline (static) ECHConfig, overriding the [global.ech] doh
  # default.
  [[listener.route]]
  name = "site-a"
  type = "ech"
  match_sni = [".site-a.example"]    # exact | *.x | .x (suffix) | ~regex
  upstream = "edge.example:443"
  # override_sni = "real.inner.example" # inner (protected) SNI; unset = inbound SNI
  # nat64_prefix / addr_resolver / ech_resolver may be set here, per route.

    [listener.route.ech]
    mode = "static"                  # override the global "doh" default
    config = "<base64 ECHConfigList>"

  # These two collapse to just match_sni (+ use): type comes from the `ech-edge`
  # template, and mode/ech_domain/require_ech from [global.ech].
  # `upstream` omitted → reflect to <matched SNI>:443 (this listener's port).
  [[listener.route]]
  name = "grouped"
  use = "ech-edge"
  match_sni = [".site-b.example", ".site-c.example"]

  [[listener.route]]
  name = "site-d"
  use = "ech-edge"
  match_sni = [".site-d.example"]
  upstream = "127.0.0.1:80"          # override the reflecting default

  # Plain TLS upstream with an overridden SNI.
  [[listener.route]]
  name = "direct"
  type = "tls"
  match_sni = ["*.direct.example"]
  upstream = "127.0.0.1:8866"
  override_sni = "backend.internal"

  # Cleartext HTTP upstream.
  [[listener.route]]
  name = "plain"
  type = "http"
  match_sni = ["plain.example"]
  upstream = "127.0.0.1:8080"

  # Catch-all for SNI/Host matching no route above.
  [listener.default_route]
  type = "tls"
  upstream = "127.0.0.1:443"
  require_ech = false
  fail = { mode = "close" }

# ===========================================================================
# Listener 2 — 8443, raw passthrough (no termination, no cert issued)
# ===========================================================================
[[listener]]
addr = "0.0.0.0:8443"
connect_timeout = "5s"

  [[listener.route]]
  name = "raw-a"
  type = "raw"
  match_sni = [".raw.example"]
  upstream = "127.0.0.1:5553"

  # Reflect: splice each connection back to its own SNI/Host on this listener's
  # port (8443). `upstream` is omitted. Set `upstream = "9000"` to reflect to
  # <SNI/Host>:9000 instead.
  [[listener.route]]
  name = "reflect"
  type = "raw"
  match_sni = [".mirror.example"]
